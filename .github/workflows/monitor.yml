name: GitHub新项目监控 邮件推送
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show debug info
        run: |
          echo "PATH=$PATH"
          which python3
          python3 --version
          ls -la

      - name: Install requests
        run: python3 -m pip install requests

      - name: Run script
        run: python3 monitor.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Export mail body
        id: read_body
        run: echo "BODY=$(cat mail_body.txt)" >> $GITHUB_OUTPUT

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: GitHub新项目监控日报
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub监控机器人
          body: ${{ steps.read_body.outputs.BODY }}
