name: GitHub新项目监控 邮件推送
on:
  schedule:
    - cron: '0 1 * * *' # UTC 01点 = 北京时间早上9点
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: Python搜索并生成邮件内容
        shell: python
        run: |
          import requests
          import os

          # ========= 修改这里的搜索条件 =========
          query = "topic:llm-agent stars:>100 created:>2026-01-01"
          # =====================================
          headers = {"Authorization": f"token:{os.getenv('GH_TOKEN')}"}
          url = f"https://api.github.com/search/repositories?q={query}&sort=created&order=desc&per_page=30"
          resp = requests.get(url, headers=headers)
          data = resp.json()
          items = data.get("items", [])

          old_ids = set()
          try:
            with open("last.txt", "r", encoding="utf-8") as f:
              old_ids = set(f.read().splitlines())
          except FileNotFoundError:
            pass

          new_repos = [item for item in items if str(item["id"]) not in old_ids]

          # 保存本次仓库ID
          with open("last.txt", "w", encoding="utf-8") as f:
            f.write("\n".join([str(x["id"]) for x in items]))

          # 组装markdown正文
          if new_repos:
            body_text = "# 📢 GitHub新项目日报\n\n"
            for repo in new_repos:
              star = repo["stargazers_count"]
              name = repo["full_name"]
              link = repo["html_url"]
              desc = repo["description"] or "无简介"
              body_text += f"- [{name}]({link}) ⭐{star}\n> {desc}\n\n"
          else:
            body_text = "✅ 今日没有匹配条件的新项目"

          # 写入文件
          with open("mail_body.txt", "w", encoding="utf-8") as f:
            f.write(body_text)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 读取邮件正文
        id: read_body
        run: echo "BODY=$(cat mail_body.txt)" >> $GITHUB_OUTPUT

      - name: 发送QQ邮件
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: GitHub新项目监控日报
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub监控机器人
          body: ${{ steps.read_body.outputs.BODY }}
