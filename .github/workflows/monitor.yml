name: GitHub新项目监控 邮件推送
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # UTC12点 = 北京时间20点，可按需调整

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true # 保证能写回历史txt文件

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: python3 -m pip install requests

      - name: 拉取仓库数据，生成邮件正文
        id: gen_content
        run: python3 monitor.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 不再在这里写SEARCH_QUERY_*，自动读取仓库Repository variables

      - name: 发送QQ邮件
        uses: dawidd6/action-send-mail@v5
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: GitHub新项目监控日报
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub监控 <${{ secrets.EMAIL_USER }}>
          body: ${{ steps.gen_content.outputs.mail_body }}

      # 新增：把历史记录txt文件提交回仓库，持久化，防止重复告警！【非常关键，原来yml缺失这一步】
      - name: Commit & Push 历史记录文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update repo history id"
          git push
