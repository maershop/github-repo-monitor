name: GitHub新项目监控 邮件推送
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # UTC12点 = 北京时间20点，可按需调整

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: python3 -m pip install requests

      - name: 拉取仓库数据，生成邮件正文
        id: gen_content
        run: python3 monitor.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SEARCH_QUERY_AGENT: ${{ vars.SEARCH_QUERY_AGENT }}
          SEARCH_QUERY_DOC_PIPELINE: ${{ vars.SEARCH_QUERY_DOC_PIPELINE }}
          SEARCH_QUERY_TABLE: ${{ vars.SEARCH_QUERY_TABLE }}
          SEARCH_QUERY_RAG_KB: ${{ vars.SEARCH_QUERY_RAG_KB }}
          SEARCH_QUERY_SCRIPT: ${{ vars.SEARCH_QUERY_SCRIPT }}
          SEARCH_QUERY_WEB_DESIGN: ${{ vars.SEARCH_QUERY_WEB_DESIGN }}
          SEARCH_QUERY_EDUCATION: ${{ vars.SEARCH_QUERY_EDUCATION }}
          SEARCH_QUERY_LIVE_TOOLS: ${{ vars.SEARCH_QUERY_LIVE_TOOLS }}
          SEARCH_QUERY_OFFICE_AUTO: ${{ vars.SEARCH_QUERY_OFFICE_AUTO }}

      - name: 发送QQ邮件
        uses: dawidd6/action-send-mail@v5
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: GitHub新项目监控日报
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub监控 <${{ secrets.EMAIL_USER }}>
          body: ${{ steps.gen_content.outputs.mail_body }}

      - name: Commit & Push 历史记录文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.txt || true
          git diff --quiet && git diff --staged --quiet || { git commit -m "auto update repo history id"; git push; }
