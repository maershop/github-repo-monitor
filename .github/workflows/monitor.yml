name: GitHub新项目监控 邮件推送
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # UTC12点 = 北京时间20点，你可以按需调整

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: python3 -m pip install requests

      - name: 拉取仓库数据，生成邮件正文
        id: gen_content
        run: python3 monitor.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # ========== 所有关键词在这里修改 ==========
          SEARCH_QUERY_AGENT: "llm agent stars:>50 created:>2026-01-01"
          SEARCH_QUERY_DOC_PIPELINE: "web scraper document parser text cleaning rag pipeline stars:>80 language:python"
          SEARCH_QUERY_TABLE: "csv excel data cleaning table parse agent stars:>80 language:python"
          SEARCH_QUERY_RAG_KB: "rag knowledge base ingestion document loader stars:>80 language:python"
          SEARCH_QUERY_SCRIPT: "content generation short video script agent stars:>80 language:python"

      - name: 发送QQ邮件
        uses: dawidd6/action-send-mail@v5
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: GitHub新项目监控日报
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub监控 <${{ secrets.EMAIL_USER }}>
          body: ${{ steps.gen_content.outputs.mail_body }}
