name: GitHub新项目监控 邮件推送
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python3 -m pip install requests

      - name: 拉取仓库数据，生成邮件正文
        id: gen_content
        run: python3 monitor.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # ========== 关键词在这里改 ==========
          SEARCH_QUERY: "llm agent stars:>50 created:>2026-01-01"

      - name: 发送QQ邮件（dawidd6/action-send-mail，社区成熟nodemailer）
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: GitHub新项目监控日报
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub监控 <${{ secrets.EMAIL_USER }}>
          body: ${{ steps.gen_content.outputs.mail_body }}
